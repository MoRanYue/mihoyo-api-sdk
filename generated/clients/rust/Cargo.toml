[package]
name = "uigf-mihoyo"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "MiHoYo, MiYouShe, HoYoLAB and HoYoverse clients generated by the official TypeSpec emitter."
repository = "https://github.com/MoRanYue/mihoyo-api-sdk"
rust-version = "1.85"
# The emitter only writes Cargo.toml when this file is absent, so keep name/version in sync with tspconfig.yaml and list every dependency the emitter adds.
include = ["src/**/*.rs", "tests/**/*.rs", "Cargo.toml", "LICENSE", "services.json"]

[dependencies]
async-trait = "0.1"
# azure_core's default features add deflate/gzip compression, which the generated code never uses; a TLS transport and an async runtime are enough, and callers can still enable more azure_core features from their own manifest.
azure_core = { version = "1.1", default-features = false, features = ["reqwest", "reqwest_rustls", "tokio"] }
getrandom = "0.4"
md5 = "0.8"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# The DS policy is exercised through the generated pipeline against a mock server.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
